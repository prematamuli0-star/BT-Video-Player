
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>BT Video Player</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #15233b;
    }
    header {
      padding: 22px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #e7edf5;
    }
    .logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg,#00c6ff,#0757ee);
      color: white;
      display: grid;
      place-items: center;
      font-size: 21px;
      font-weight: bold;
    }
    h1 { font-size: 21px; margin: 0 0 5px; }
    header p { margin: 0; color: #0878e8; font-size: 12px; }
    main { padding: 16px; }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 18px;
    }
    .tabs button {
      flex: 1;
      padding: 12px 10px;
      border: 0;
      border-radius: 12px;
      background: #edf5ff;
      color: #1557bc;
      font-weight: bold;
    }
    .tabs button.active { background: #0878f9; color: white; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d9e3ef;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 18px;
    }
    h2 { font-size: 19px; margin: 18px 0 12px; }
    #videos {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 12px;
    }
    .video {
      padding: 14px;
      border: 1px solid #e0e9f5;
      border-radius: 14px;
      background: #f8fbff;
      overflow-wrap: anywhere;
    }
    .video .symbol { font-size: 30px; color: #0878f9; }
    .video strong { display: block; margin-top: 8px; font-size: 14px; }
    .video small { display: block; color: #68778c; margin-top: 5px; }
    .empty {
      grid-column: 1 / -1;
      padding: 28px 12px;
      text-align: center;
      color: #63738a;
      background: #f5f8fc;
      border-radius: 14px;
      line-height: 1.7;
    }
    #status { color: #63738a; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">BT</div>
    <div>
      <h1>BT Video Player</h1>
      <p>Bhanumoti Tamuli</p>
    </div>
  </header>
  <main>
    <nav class="tabs">
      <button class="active" onclick="showTab('All',this)">All</button>
      <button onclick="showTab('Recent',this)">Recent</button>
      <button onclick="showTab('Folders',this)">Folders</button>
      <button onclick="showTab('Favorites',this)">Favorites</button>
    </nav>
    <input id="search" placeholder="Search videos..." oninput="render()">
    <h2 id="heading">Local Videos</h2>
    <p id="status">Choose videos from your phone to get started.</p>
    <button onclick="pickVideos()" style="padding:12px 16px;background:#0878f9;color:white;border:0;border-radius:10px;font-weight:bold">＋ Add Videos</button>
    <input id="picker" type="file" accept="video/*" multiple hidden onchange="loadVideos(this.files)">
    <section id="videos">
      <div class="empty">Your video library will appear here.<br>Tap “Add Videos” to select local videos.</div>
    </section>
  </main>
  <script>
    let library = [];
    let tab = 'All';
    function pickVideos() {
      document.getElementById('picker').click();
    }
    function loadVideos(files) {
      for (const file of files) {
        library.push({
          name: file.name,
          size: file.size,
          url: URL.createObjectURL(file),
          file: file
        });
      }
      document.getElementById('status').textContent =
        library.length + ' video(s) selected';
      render();
    }
    function showTab(value, button) {
      tab = value;
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      button.classList.add('active');
      document.getElementById('heading').textContent =
        value === 'All' ? 'Local Videos' : value + ' Videos';
      render();
    }
    function render() {
      const q = document.getElementById('search').value.toLowerCase();
      const list = library.filter(v => v.name.toLowerCase().includes(q));
      const area = document.getElementById('videos');
      if (!list.length) {
        area.innerHTML = '<div class="empty">No videos found.<br>Select videos using Add Videos.</div>';
        return;
      }
      area.replaceChildren();
      list.forEach(v => {
        const card = document.createElement('div');
        card.className = 'video';
        const icon = document.createElement('div');
        icon.className = 'symbol';
        icon.textContent = '▶';
        const name = document.createElement('strong');
        name.textContent = v.name;
        const info = document.createElement('small');
        info.textContent = (v.size / 1048576).toFixed(1) + ' MB';
        card.append(icon, name, info);
        card.onclick = () => {
          const url = URL.createObjectURL(v.file);
          const win = window.open('', '_blank');
          if (win) {
            const video = win.document.createElement('video');
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            video.style.cssText = 'width:100%;height:100%;background:#000';
            win.document.body.style.cssText = 'margin:0;background:#000';
            win.document.body.appendChild(video);
            video.src = url;
          } else {
            alert('Allow this page to open the video player.');
          }
        };
        area.appendChild(card);
      });
    }
  </script>
</body>
</html>
