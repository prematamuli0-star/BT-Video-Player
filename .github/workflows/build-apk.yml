
name: BT Video Player Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android source ZIP
        run: |
          unzip -o BT_Video_Player_New_Source.zip -d extracted
          echo "Files extracted:"
          find extracted -name settings.gradle.kts -o -name settings.gradle

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle settings file not found in ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BT-Video-Player-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
